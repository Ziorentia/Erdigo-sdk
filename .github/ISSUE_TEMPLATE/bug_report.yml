name: Bug report
description: Something in the SDK, the erdigo-send tool or the specification is wrong.
body:
  - type: markdown
    attributes:
      value: |
        **Found a security problem?** Please do not file it here. See [SECURITY.md](https://github.com/Ziorentia/Erdigo-sdk/blob/main/SECURITY.md).
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you post
      description: This repository is public, and issues cannot be fully erased.
      options:
        - label: I removed keys, fingerprints, pairing codes, QR codes, coordinates, addresses and map screenshots. Adding `--redact` to an `erdigo-send` command helps with this.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: The mock receiver (`erdigo-send serve --mock`) is ideal for this.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK, commit and system
      description: Which folder (swift, dotnet, python, nodejs, java or php), the commit, and the system with its runtime version, for example "python, 1a2b3c4, Windows 11, Python 3.12".
    validations:
      required: true
