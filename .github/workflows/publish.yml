name: Publish

# Puts a released version of the Python, Node.js and .NET SDKs on PyPI, npm and nuget.org. The Swift SDK needs nothing
# more than the release's tag, and the Java and PHP SDKs are not published. docs/releasing.md says how a release is made.
#
# It runs when a release is published, and can be run again by hand on the release's tag (gh workflow run publish.yml
# --ref v1.0.0), for example after a registry is set up. No password or API key is kept in this repository: each
# registry trusts this workflow and the environment its job runs in (trusted publishing), and a registry is used only
# once its repository variable (PUBLISH_PYPI, PUBLISH_NPM, PUBLISH_NUGET) is set to true. A version that is already
# on a registry is left as it is.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # actions/checkout v4.2.2. The whole history, to check that the tag is on main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only a tag like v1.2.3 on a commit of main is published, and only if every edition says that version.
      - name: Check the tag and the versions
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF" in refs/tags/*) ;; *) echo "::error::Run this on a release tag, not $REF."; exit 1 ;; esac
          if ! [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag $REF_NAME is not of the form v1.2.3."; exit 1
          fi
          version="${REF_NAME#v}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag $REF_NAME is not on main."; exit 1
          fi
          found() { grep -qF -- "$2" "$1" || { echo "::error file=$1::Expected $2"; failed=1; }; }
          failed=0
          found python/pyproject.toml "version = \"$version\""
          found python/src/erdigo_sdk/__init__.py "__version__ = \"$version\""
          found python/src/erdigo_sdk/pairing.py "erdigo-python/$version\""
          found nodejs/package.json "\"version\": \"$version\""
          found nodejs/src/pairing.js "erdigo-nodejs/$version'"
          found dotnet/Directory.Build.props "<Version>$version</Version>"
          found dotnet/src/Erdigo.Sdk/Pairing.cs "erdigo-dotnet/$version\""
          found swift/Sources/ErdigoSDK/Pairing.swift "erdigo-swift/$version\""
          found java/src/main/java/com/ziorentia/erdigo/sdk/Pairing.java "erdigo-java/$version\""
          found php/src/Pairing.php "erdigo-php/$version'"
          found python/tests/test_pairing.py "erdigo-python/$version\""
          # The project's own version, on the line after its artifactId, not a plugin's.
          grep -A1 -F "<artifactId>erdigo-sdk</artifactId>" java/pom.xml | grep -qF "<version>$version</version>" \
            || { echo "::error file=java/pom.xml::Expected <version>$version</version>"; failed=1; }
          [ "$failed" = 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-python:
    name: Build the Python package
    needs: check
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # The build backend comes from requirements/test.txt, with its hashes, as in the Python workflow.
      - name: Build
        run: |
          python -m pip install --require-hashes -r requirements/test.txt
          python -c "from setuptools import build_meta as b; b.build_sdist('dist'); b.build_wheel('dist')"
          ls -l dist
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --require-hashes -r requirements/test.txt
          /tmp/check/bin/pip install --no-deps dist/erdigo_sdk-${{ needs.check.outputs.version }}-py3-none-any.whl
          /tmp/check/bin/erdigo-send help > /dev/null
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish-python:
    name: Publish to PyPI
    needs: [check, build-python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/erdigo-sdk/${{ needs.check.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-dist
          path: dist/
      # pypa/gh-action-pypi-publish v1.14.3, with trusted publishing.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true

  build-npm:
    name: Build the npm package
    needs: check
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nodejs
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Pack
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir ../npm-dist && mv "$RUNNER_TEMP"/erdigo-sdk-*.tgz ../npm-dist/
          tar -tzf ../npm-dist/erdigo-sdk-${{ needs.check.outputs.version }}.tgz
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: [check, build-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/erdigo-sdk/v/${{ needs.check.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/setup-node v4.4.0. No registry-url: npm signs in with this job's OIDC token, not a saved token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm
        run: npm install --global npm@11.21.3
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-dist
          path: npm-dist/
      - name: Publish
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The ./ matters: without it npm reads "npm-dist/x.tgz" as a GitHub repository, not this file.
          tarball="./npm-dist/erdigo-sdk-$VERSION.tgz"
          test -f "$tarball"
          if npm view "erdigo-sdk@$VERSION" version > /dev/null 2>&1; then
            echo "erdigo-sdk $VERSION is already on npm."
          else
            npm publish "$tarball" --access public --ignore-scripts
          fi

  build-nuget:
    name: Build the NuGet packages
    needs: check
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-dotnet v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      # Restored exactly as the lock files say, checked against known vulnerabilities, as in the .NET workflow.
      - name: Pack
        run: |
          for project in Erdigo.Core Erdigo.Sdk Erdigo.MockReceiver erdigo-send; do
            dotnet restore "src/$project" --locked-mode -p:NuGetAuditMode=all
            dotnet pack "src/$project" --no-restore --configuration Release --output ../nuget-dist
          done
          ls -l ../nuget-dist
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-dist
          path: nuget-dist/
          if-no-files-found: error

  publish-nuget:
    name: Publish to nuget.org
    needs: [check, build-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Erdigo.Sdk/${{ needs.check.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/setup-dotnet v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nuget-dist
          path: nuget-dist/
      # NuGet/login v1.2.0: trades this job's OIDC token for an API key that lasts about an hour. NUGET_USER is the
      # nuget.org account that owns the packages; it is a name, not a secret.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # The symbol packages (.snupkg) go up with the packages they belong to.
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nuget-dist/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
