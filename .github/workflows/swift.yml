name: Swift

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code. A private repository needs this much to check it out.
permissions:
  contents: read

jobs:
  swift-sdk:
    name: Swift SDK (macos-15)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Command-line checks
        env:
          # Also run the mocks that listen on the local network; nobody is there to see a firewall question.
          ERDIGO_LAN_CHECKS: "1"
        run: swift/Tests/cli-smoke.sh
