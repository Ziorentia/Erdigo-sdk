name: .NET

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code. A private repository needs this much to check it out.
permissions:
  contents: read

jobs:
  dotnet-sdk:
    name: .NET SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-dotnet v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      # Exactly what the lock files say, with every package checked against nuget.org's list of known
      # vulnerabilities, including the ones packages bring with them. Directory.Build.props makes a vulnerability
      # of any severity, or a list that cannot be fetched, an error, so this step fails rather than pass unchecked.
      - name: Restore
        run: dotnet restore Erdigo.sln --locked-mode -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build Erdigo.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Erdigo.sln --no-build --configuration Release
      # The checks drive the tools through pseudo terminals, which Windows does not have.
      - name: Command-line checks
        if: runner.os == 'Linux'
        run: CONFIGURATION=Release tests/cli-smoke.sh
